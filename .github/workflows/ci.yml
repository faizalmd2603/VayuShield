name: VayuShield CI Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Code Quality, Types, Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run complete verification pipeline
        run: npm run verify
        env:
          VITE_SERPAPI_KEY: mock_ci_serpapi_key
          VITE_GEMINI_API_KEY: mock_ci_gemini_key
